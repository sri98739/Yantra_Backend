# NodePort so it works on local clusters (Docker Desktop, minikube) without an ingress:
#   Docker Desktop -> http://localhost:30081
#   minikube       -> minikube service yantra-backend -n yantra
apiVersion: v1
kind: Service
metadata:
  name: yantra-backend
  namespace: yantra
  labels:
    app: yantra-backend
spec:
  type: NodePort
  selector:
    app: yantra-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
